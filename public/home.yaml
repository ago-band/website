home:
    languages:
        de:
            paragraphs:
                - >
                    ago ist ein musikprojekt von robin woern und manuel minniti aus stuttgart. die band wird bei live-auftritten von gastmusiker*innen ergänzt.
                - >
                    die kompositionen verbinden moderne elektronische musik wie electronica, new wave oder synth pop mit post rock, shoegaze und einem leichten krautrock-einfluss.
                - >
                    nach einer pause haben wir 2025 angefangen, an neuer musik zu arbeiten, die wir voraussichtlich 2027 veröffentlichen werden. außerdem planen wir, gegen ende des jahres mit einem neuen ensemble einige live-shows zu spielen.
        en:
            paragraphs:
                - >
                    ago is a music project by robin woern and manuel minniti from stuttgart, germany. the band is complemented by guest musicians during live performances.
                - >
                    the compositions combine modern electronic music like electronica, new wave or synth pop with post rock, shoegaze and a slight kraut rock-impact.
                - >
                    after pausing the project for a while, we have started working on new music in 2025 which we are planning to release some time in 2027. we are also planning on playing some live shows with a new ensemble at the end of this year.
