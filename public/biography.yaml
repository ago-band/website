biography:
    languages:
        de:
            paragraphs:
                - ago ist ein musikprojekt von robin woern und manuel minniti aus stuttgart. die band wird bei live-auftritten von gastmusiker*innen ergänzt. nach der veröffentlichung ihrer debütsingle „sun" auf vinyl im mai 2018 spielten sie eine tour in israel mit der band D.R.Y.
                - zusammen mit dem leadsänger Dmitry Polykov von D.R.Y. veröffentlichten sie im oktober 2019 die ep "blessed" auf einer 7" unter dem gleichnamigen projekt.
                - ihr debütalbum "chroma" wurde am 23. juli 2021 veröffentlicht, produziert von Ralv Milberg. kalte und dunkle klänge zentraleuropas kontrastieren mit nahöstlichen einflüssen. popkompositionen werden von verschiedenen sängern und treibenden rhythmen ergänzt. es besteht jedoch keine absicht, wie fertig produzierter mainstream-pop zu klingen.
                - die kompositionen verbinden moderne elektronische musik wie electronica, new wave oder synth pop mit post rock, shoegaze und einem leichten krautrock-einfluss.
                - nach mehrjähriger pause spielen ago ab herbst 2026 wieder konzerte. live wird das duo von lena meinhardt (gitarre, synthesizer) und felix schäfer (schlagzeug, percussion) unterstützt.

        en:
            paragraphs:
                - ago is a music project by robin woern and manuel minniti from stuttgart. the band is complemented by guest musicians during live performances. after releasing their debut single „sun" on vinyl in may 2018, they played a tour in israel with the local group D.R.Y.
                - along with lead vocalist Dmitry Polykov of D.R.Y. they released the "blessed" ep on a 7" in october 2019 under the same-titled project.
                - their debut album "chroma" was released on july 23rd 2021, produced by Ralv Milberg. cold and dark sounds of central europe contrast middle-eastern influences. pop compositions are complemented by various vocalists and driving rhythms. however, there is no intention of sounding like off-the-shelf mainstream pop.
                - the compositions combine modern electronic music like electronica, new wave or synth pop with post rock, shoegaze and a slight kraut rock-impact.
                - following a several-year break, ago will return to playing live concerts in autumn 2026. on stage, the duo is supported by lena meinhardt (guitar, synthesizer) and felix schäfer (drums, percussion).
