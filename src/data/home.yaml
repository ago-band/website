home:
    languages:
        de:
            paragraphs:
                - >
                    ago ist ein musikprojekt von manuel minniti und robin woern aus stuttgart. die überwiegend instrumentalen kompositionen verbinden new wave, electronica und synth-pop mit shoegaze- und krautrock-einflüssen.
                - >
                    nach mehrjähriger pause spielen ago ab herbst wieder konzerte mit neuer musik, die im kommenden jahr erscheinen wird. live wird das duo von lena meinhardt (gitarre, synthesizer) und felix schäfer (schlagzeug, percussions) unterstützt.
        en:
            paragraphs:
                - >
                    ago is a music project by manuel minniti and robin woern from stuttgart. their mainly instrumental compositions combine new wave, electronica, and synth-pop with shoegaze and krautrock influences.
                - >
                    following a several-year break, ago will return to playing live concerts this autumn with new music set for release next year. on stage, the duo is supported by lena meinhardt (guitar, synthesizer) and felix schäfer (drums, percussions).
